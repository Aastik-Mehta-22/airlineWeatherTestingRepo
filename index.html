<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airline Disruption Monitor</title>
<style>
  :root{--bg:#0f1720;--card:#18232f;--line:#263545;--tx:#e6edf3;--mut:#8aa0b4;
        --ok:#2ecc71;--warn:#f5a623;--bad:#ff5c5c;--acc:#4da3ff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;margin:0;flex:1}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
  main{padding:16px 20px;display:grid;gap:16px;max-width:1300px;margin:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .kpi b{font-size:26px;display:block}
  .airports{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .ap{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:10px;background:#142029}
  .ap.warn{border-left-color:var(--warn)} .ap.bad{border-left-color:var(--bad)}
  .ap .code{font-weight:700;font-size:16px} .ap small{color:var(--mut)}
  .cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:12px}
  .tw{overflow-x:auto}
  .pill{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
  .p-ok{background:#12351f;color:var(--ok)} .p-warn{background:#3d2d0c;color:var(--warn)} .p-bad{background:#431a1a;color:var(--bad)}
  .why{color:var(--mut);font-size:12px;white-space:normal;max-width:360px}
  tr.flash{animation:fl 1.2s} @keyframes fl{from{background:#2a3b4d}to{background:transparent}}
  button,select,input{background:#223244;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
  button{cursor:pointer} button:hover{border-color:var(--acc)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ev{border-bottom:1px solid var(--line);padding:8px 0}
  .ev:last-child{border:0} .ev small{color:var(--mut)}
  .log{font:12px ui-monospace,Consolas,monospace;color:var(--mut);max-height:130px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>✈ Airline Disruption Monitor <small style="color:var(--mut);font-weight:400">weather + events → flight impact</small></h1>
  <span id="updated" style="color:var(--mut)"></span>
  <button id="refresh">Refresh weather</button>
</header>
<main>
  <section class="card kpis" id="kpis"></section>

  <section class="card"><h2>Airports — ingested weather & event risk</h2><div class="airports" id="airports"></div></section>

  <div class="cols">
    <section class="card"><h2>Flights — live status</h2><div class="tw"><table id="flights"></table></div></section>
    <section class="card">
      <h2>Event feed</h2>
      <div id="events"></div>
      <h2 style="margin-top:14px">Simulate / ingest</h2>
      <div class="row">
        <select id="simAp"></select>
        <select id="simType">
          <option value="storm">Thunderstorm (weather)</option>
          <option value="snow">Heavy snow (weather)</option>
          <option value="fog">Dense fog (weather)</option>
          <option value="strike">Strike (event)</option>
          <option value="atc">ATC outage (event)</option>
          <option value="security">Security incident (event)</option>
          <option value="ash">Volcanic ash (event)</option>
          <option value="festival">Mass event / festival (event)</option>
        </select>
        <button id="simGo">Inject</button>
        <button id="simClear">Clear all</button>
      </div>
      <h2 style="margin-top:14px">Flight change history</h2>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>

<script>
/* Frontend is now a thin client: all ingest + rules run in the Python backend. */
const $ = id => document.getElementById(id);
const api = async (path, method = "GET", body) => {
  const r = await fetch("/api" + path, { method, headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
};
const ICON = { strike: "✊", atc: "📡", security: "🚨", ash: "🌋", festival: "🎪" };
const cls = s => s >= 60 ? "bad" : s >= 20 ? "warn" : "ok";
const prev = {};
let airportsFilled = false;

function render(s) {
  const k = s.kpis;
  $("kpis").innerHTML = [["Flights", k.flights], ["On time", k.on_time], ["Delayed", k.delayed],
    ["Cancelled", k.cancelled], ["Avg delay", k.avg_delay + " min"], ["Active events", k.active_events]]
    .map(([a, v]) => `<div class="kpi"><small style="color:var(--mut)">${a}</small><b>${v}</b></div>`).join("");

  if (!airportsFilled) {
    $("simAp").innerHTML = Object.keys(s.airports).map(a => `<option>${a}</option>`).join("");
    airportsFilled = true;
  }

  $("airports").innerHTML = Object.entries(s.airports).map(([a, r]) => {
    const w = r.weather, c = cls(r.score);
    return `<div class="ap ${c === "ok" ? "" : c}">
      <div class="code">${a} <small>${r.name}</small></div>
      <div>Risk <b>${r.score}</b>/100 ${r.live ? "" : "<small>(sim)</small>"}</div>
      <small>${w.temp}°C · wind ${w.wind | 0}/${w.gust | 0} km/h · vis ${(w.vis / 1000).toFixed(1)} km${w.precip ? ` · rain ${w.precip}mm` : ""}</small><br>
      <small>${r.why.length ? "⚠ " + r.why.join(", ") : "No disruption factors"}</small></div>`;
  }).join("");

  $("flights").innerHTML = `<tr><th>Flight</th><th>Route</th><th>Sched.</th><th>Status</th><th>New dep.</th><th>Impact</th><th>Why</th></tr>` +
    s.flights.map(f => {
      const p = prev[f.no], changed = p && (p.status !== f.status || p.delay !== f.delay);
      const [h, m] = f.dep.split(":").map(Number), t = (h * 60 + m + f.delay) % 1440;
      const nd = f.status === "Cancelled" ? "—" : `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
      const pc = f.status === "On time" ? "p-ok" : f.status === "Delayed" ? "p-warn" : "p-bad";
      return `<tr class="${changed ? "flash" : ""}"><td><b>${f.no}</b></td><td>${f.frm} → ${f.to}</td><td>${f.dep}</td>
        <td><span class="pill ${pc}">${f.status}${f.delay ? ` +${f.delay}m` : ""}</span></td><td>${nd}</td><td>${f.score}</td>
        <td class="why">${f.reasons.join("; ") || "—"}</td></tr>`;
    }).join("");
  s.flights.forEach(f => prev[f.no] = { status: f.status, delay: f.delay });

  const ovs = Object.entries(s.overrides).map(([a, l]) => `<div class="ev">⛈ <b>${a}</b> simulated weather: ${l}</div>`);
  const evs = s.events.map(e => `<div class="ev">${ICON[e.type] || "•"} <b>${e.airport}</b> — ${s.event_types[e.type]}
    <button style="float:right;padding:0 6px" onclick="delEvent(${e.id})">✕</button><br>
    <small>${e.note || ""} · ${new Date(e.ts).toLocaleTimeString()}</small></div>`);
  $("events").innerHTML = ovs.concat(evs).join("") || "<small>No events</small>";
}

async function loadChanges() {
  const rows = await api("/changes?limit=30");
  $("log").innerHTML = rows.map(r => `[${new Date(r.ts).toLocaleTimeString()}] <b>${r.flight}</b> → ${r.status}${r.delay ? " +" + r.delay + "m" : ""}`).join("<br>") || "No changes yet";
}

async function refresh(s) {
  try {
    render(s || await api("/state"));
    await loadChanges();
    $("updated").textContent = "Synced " + new Date().toLocaleTimeString();
  } catch (e) { $("updated").textContent = "Backend unreachable: " + e.message; }
}
async function delEvent(id) { refresh(await api("/events/" + id, "DELETE")); }

$("simGo").onclick = async () => refresh(await api("/simulate", "POST", { airport: $("simAp").value, type: $("simType").value }));
$("simClear").onclick = async () => refresh(await api("/clear", "POST"));
$("refresh").onclick = async () => refresh(await api("/refresh", "POST"));

refresh();
setInterval(refresh, 10000);  // pick up background ingest from the server
</script>
</body>
</html>
